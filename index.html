<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre - Pointage Khalif</title>
    <!-- Tailwind CSS pour un design propre -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SDK Firebase (Compat version pour une intégration simple en script) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl p-6 relative">
        <!-- Bouton Fermer / Retour -->
        <button onclick="window.location.reload()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>

        <h1 class="text-2xl font-bold text-slate-800 mb-6">Registre — Espace responsable</h1>

        <!-- Onglets -->
        <div class="flex gap-2 mb-6 border-b pb-4">
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium shadow">Pointages</button>
            <button onclick="alert('Module Employés')" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-medium hover:bg-slate-200">Employés</button>
            <button onclick="alert('Module Réglages')" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg font-medium hover:bg-slate-200">Réglages</button>
        </div>

        <!-- Sélection de la date -->
        <div class="mb-6 flex items-center gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Consulter une date</label>
                <input type="date" id="dateFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- Tableau des pointages -->
        <div class="overflow-x-auto mb-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b text-slate-400 text-xs uppercase tracking-wider">
                        <th class="py-3 px-4">Employé</th>
                        <th class="py-3 px-4">Arrivée</th>
                        <th class="py-3 px-4">Départ</th>
                        <th class="py-3 px-4">Total</th>
                    </tr>
                </thead>
                <tbody id="pointagesTableBody" class="text-slate-700 divide-y divide-slate-100">
                    <!-- Les données s'afficheront ici dynamiquement -->
                </tbody>
            </table>
        </div>

        <!-- Bouton de téléchargement Word -->
        <button onclick="telechargerWord()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2.5 rounded-xl shadow transition flex items-center gap-2">
            Télécharger le cahier du jour (Word)
        </button>
        <p class="text-xs text-slate-400 mt-2">Reprend la mise en page du Cahier d'émargement journalier Khalif Ingénierie : arrivées/départ, absences et retards (après 08h30) calculés automatiquement à partir des pointages.</p>
    </div>

    <script>
        // Configuration Firebase (Récupérée depuis ta console)
        const firebaseConfig = {
            apiKey: "AIzaSyDQzyST3m4eWC2_8fDwoLHEIbIhHM3cwq0",
            authDomain: "pointage-khalif.firebaseapp.com",
            databaseURL: "https://pointage-khalif-default-rtdb.firebaseio.com",
            projectId: "pointage-khalif",
            storageBucket: "pointage-khalif.appspot.com",
            messagingSenderId: "56869339015",
            appId: "1:56869339015:web:d9097c0d29d5ae6e5b142",
            measurementId: "G-XM50FB3EP0"
        };

        // Initialisation de Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Fixer la date du jour par défaut dans le sélecteur
        const todayStr = new Date().toISOString().split('T')[0];
        const dateInput = document.getElementById('dateFilter');
        dateInput.value = todayStr;

        // Écouter les changements de date pour réafficher les pointages correspondants
        dateInput.addEventListener('change', chargerPointages);

        function chargerPointages() {
            const selectedDate = dateInput.value;
            const tbody = document.getElementById('pointagesTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-center text-slate-400">Chargement...</td></tr>';

            // Récupération en temps réel depuis Firebase
            database.ref('pointages/' + selectedDate).on('value', (snapshot) => {
                tbody.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">Aucun pointage pour cette date.</td></tr>`;
                    return;
                }

                // Affichage de chaque employé ayant pointé
                Object.values(data).forEach(pointage => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="py-3 px-4 font-medium">${pointage.employe}</td>
                        <td class="py-3 px-4">${pointage.arrivee || '—'}</td>
                        <td class="py-3 px-4">${pointage.depart || '—'}</td>
                        <td class="py-3 px-4">${pointage.total || '—'}</td>
                    `;
                    tbody.appendChild(row);
                });
            });
        }

        // Lancer le chargement initial
        chargerPointages();

        function telechargerWord() {
            alert("Génération du rapport Word en cours...");
        }
    </script>
</body>
</html>
