<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage — Khalif Ingénierie</title>
<!-- Tailwind CSS pour un design moderne -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Bibliothèque jsPDF et son plugin autoTable pour des PDF professionnels -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<!-- Bibliothèque SheetJS (xlsx) pour générer de vrais fichiers Excel propres (.xlsx) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

<!-- En-tête / Navigation / Heure -->
<div class="max-w-4xl mx-auto px-4 py-6 w-full">
<div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
<div>
<span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Khalif Ingénierie</span>
<h1 class="text-lg font-bold text-gray-900">Registre de Présence</h1>
</div>
<!-- Bouton Admin bien visible -->
<button id="btnToggleAdmin" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs py-2 px-4 rounded-lg transition border border-indigo-200">
🔒 Espace Admin
</button>
</div>

<div class="text-center mb-6">
<div id="clock" class="text-3xl font-extrabold text-gray-900">--:--:--</div>
<div id="date" class="text-sm text-gray-500 mt-1">-</div>
</div>

<!-- ZONE DE NOTIFICATION INTÉGRÉE DANS LA PAGE -->
<div id="notificationBanner" class="hidden mb-4 p-4 rounded-xl text-center font-medium text-sm transition-all shadow-sm"></div>

<!-- ================= VUE EMPLOYÉ ================= -->
<div id="vueEmploye" class="space-y-6">
<div id="formulaireBox" class="bg-white shadow rounded-2xl p-6 border border-gray-100">

<!-- LISTE DÉROULANTE PERSONNALISÉE QUI S'OUVRE TOUJOURS VERS LE BAS -->
<div class="relative mb-4">
<label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Sélectionner ou chercher votre nom</label>
<input type="text" id="employeSearchInput" placeholder="Tapez votre nom pour filtrer..." class="w-full border border-gray-300 rounded-lg p-3 text-gray-800 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">

<!-- Conteneur de la liste vers le bas -->
<div id="employeDropdownList" class="hidden absolute left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-xl max-h-56 overflow-y-auto z-50">
<!-- Rempli dynamiquement par JS -->
</div>
<!-- Champ caché pour stocker la valeur sélectionnée -->
<input type="hidden" id="employeSelectionne" value="">
</div>

<div class="grid grid-cols-2 gap-4 mt-6">
<button id="btnArrivee" class="bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-indigo-700 transition shadow">ARRIVÉE</button>
<button id="btnDepart" class="bg-gray-700 text-white font-semibold py-3 px-4 rounded-lg hover:bg-gray-800 transition shadow">DÉPART</button>
</div>
</div>

<!-- Écran de confirmation en plein écran sur la page blanche -->
<div id="ecranConfirmation" class="hidden bg-white shadow-lg rounded-2xl p-10 border border-indigo-100 text-center space-y-4">
<div id="confirmIcon" class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
<h2 id="confirmTitre" class="text-2xl font-bold text-gray-900">Pointage enregistré !</h2>
<p id="confirmDetails" class="text-gray-600 text-base"></p>
<div class="text-xs text-gray-400 pt-4">Redirection automatique imminente...</div>
</div>
</div>

<!-- ================= VUE ADMIN (Cachée par défaut) ================= -->
<div id="vueAdmin" class="hidden space-y-6">
<div class="bg-white shadow rounded-2xl p-6 border border-gray-100">
<h2 class="text-lg font-bold text-gray-800 mb-4">Panneau d'Administration</h2>

<!-- Mot de passe admin -->
<div id="adminLoginBox" class="space-y-4">
<p class="text-sm text-gray-600">Entrez le mot de passe administrateur :</p>
<input type="password" id="adminPassword" placeholder="Mot de passe admin" class="w-full border border-gray-300 rounded-lg p-3">
<button id="btnAdminLogin" class="bg-indigo-600 text-white py-2 px-4 rounded-lg font-semibold w-full">Se connecter</button>
</div>

<!-- Contenu Admin (affiché après connexion) -->
<div id="adminContent" class="hidden space-y-6 mt-4">
<!-- Gestion des employés -->
<div class="border-t pt-4">
<h3 class="font-semibold text-gray-700 mb-2">Ajouter un employé</h3>
<div class="flex gap-2">
<input type="text" id="nouveauNom" placeholder="Nom complet" class="flex-1 border border-gray-300 rounded-lg p-2 text-sm">
<button id="btnAjouterEmploye" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Ajouter</button>
</div>
</div>

<!-- Liste des employés -->
<div class="border-t pt-4">
<h3 class="font-semibold text-gray-700 mb-2">Liste des employés</h3>
<div id="adminListeEmployes" class="max-h-60 overflow-y-auto space-y-3 border p-3 rounded-lg text-sm bg-gray-50">
<!-- Injecté par JS -->
</div>
</div>

<!-- Pointages en temps réel (24h max) & PDF/Excel -->
<div class="border-t pt-4">
<div class="flex flex-wrap justify-between items-center mb-2 gap-2">
<h3 class="font-semibold text-gray-700">Pointages récents (Dernières 24h)</h3>
<div class="flex gap-2">
<button id="btnPdfJour" class="bg-blue-600 text-white text-xs px-3 py-2 rounded-lg font-semibold hover:bg-blue-700">📄 PDF du jour</button>
<button id="btnExcelGlobal" class="bg-emerald-600 text-white text-xs px-3 py-2 rounded-lg font-semibold hover:bg-emerald-700">📊 Récap Excel & Heures d'Absence</button>
</div>
</div>
<div id="adminListePointages" class="max-h-48 overflow-y-auto space-y-2 border p-2 rounded-lg text-xs bg-gray-50">
<!-- Injecté par JS -->
</div>
</div>

<!-- Modification du mot de passe Admin -->
<div class="border-t pt-4">
<h3 class="font-semibold text-gray-700 mb-2">Sécurité : Modifier le mot de passe Admin</h3>
<div class="space-y-2">
<input type="password" id="nouveauPasswordAdmin" placeholder="Nouveau mot de passe admin" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
<button id="btnChangerPasswordAdmin" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-gray-900 w-full">Mettre à jour le mot de passe Admin</button>
</div>
</div>

</div>
</div>
</div>

</div>

<!-- Scripts Firebase et Logique Métier -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push, get, remove, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyDQzystm4eWC2_8fdWoLHFThThhM3cwq0",
authDomain: "pointage-khalif.firebaseapp.com",
databaseURL: "https://pointage-khalif-default-rtdb.firebaseio.com",
projectId: "pointage-khalif",
storageBucket: "pointage-khalif.appspot.com",
messagingSenderId: "568693399015",
appId: "1:568693399015:web:d9097c0d29dd5ae6e5b142",
measurementId: "G-XM50BF3EP0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const employesRef = ref(db, 'employes');
const pointagesRef = ref(db, 'pointages');
const adminPassRef = ref(db, 'admin/password');

// Liste initiale complète des 20 employés
const listeInitialeEmployes = [
"Khalif", "Anani Ulrich", "Jean", "ASSALE Anabelle", "BOKA Axel",
"GBE Keani Elue Excelle", "GOUAN Fiacre", "KOUAKOU Carole",
"OULAI Tiemoko Perside", "OUEDRAOGO Nicanor", "OYEKALE Samuel Sunday",
"SEDE Mleanin Cecile", "TEHA Kouyo Franck", "YOLOU Bleda Sandrine",
"WAYOU Claude Sostherne", "ADOPO Jorim", "TAPE Marie-Emmanuelle",
"CAMARA Alpha", "KOFFI Israel", "OPKO Michel"
];

// Nettoyage automatique des pointages de plus de 24 heures (Rétention 24h)
function purgerPointagesAnciens() {
    get(pointagesRef).then((snapshot) => {
        if (snapshot.exists()) {
            const maintenant = Date.now();
            const limite24h = 24 * 60 * 60 * 1000; // 24 heures en millisecondes
            snapshot.forEach((childSnapshot) => {
                const pointage = childSnapshot.val();
                if (pointage.timestamp && (maintenant - pointage.timestamp > limite24h)) {
                    remove(ref(db, `pointages/${childSnapshot.key}`));
                }
            });
        }
    });
}
setInterval(purgerPointagesAnciens, 60 * 60 * 1000); // Vérification toutes les heures
purgerPointagesAnciens();

// Injection intelligente des employés initiaux
get(employesRef).then((snapshot) => {
const employesActuels = snapshot.exists() ? Object.values(snapshot.val()).map(e => e.nom) : [];
listeInitialeEmployes.forEach(nom => {
if (!employesActuels.includes(nom)) {
const newRef = push(employesRef);
set(newRef, { nom: nom });
}
});
});

get(adminPassRef).then((snapshot) => {
if (!snapshot.exists()) {
set(adminPassRef, "admin123");
}
});

function afficherNotification(message, type = 'erreur') {
const banner = document.getElementById('notificationBanner');
banner.textContent = message;
banner.className = `mb-4 p-4 rounded-xl text-center font-medium text-sm transition-all shadow-sm ${
type === 'succes' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200'
}`;
banner.classList.remove('hidden');
setTimeout(() => banner.classList.add('hidden'), 4000);
}

setInterval(() => {
const now = new Date();
document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}, 1000);

let donneesEmployesGlobal = {};
let listeNomsEmployes = [];
let pointagesAujourdHuiGlobal = [];

onValue(employesRef, (snapshot) => {
const adminListe = document.getElementById('adminListeEmployes');
if(adminListe) adminListe.innerHTML = '';
listeNomsEmployes = [];

if (snapshot.exists()) {
donneesEmployesGlobal = snapshot.val();
let employesArray = [];

Object.keys(donneesEmployesGlobal).forEach((key) => {
employesArray.push({ key: key, ...donneesEmployesGlobal[key] });
});

employesArray.sort((a, b) => a.nom.localeCompare(b.nom));

employesArray.forEach((emp) => {
listeNomsEmployes.push(emp.nom);

if(adminListe) {
const div = document.createElement('div');
div.className = "bg-white p-3 border rounded-lg flex justify-between items-center";
div.innerHTML = `
<span><b>${emp.nom}</b></span>
<div>
<button onclick="genererPdfEmploye('${emp.nom}')" class="bg-indigo-100 text-indigo-700 px-2 py-1 rounded text-xs mr-1 font-semibold">PDF Fiche</button>
<button onclick="supprimerEmploye('${emp.key}')" class="bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-semibold">Supprimer</button>
</div>`;
adminListe.appendChild(div);
}
});
}
});

// --- GESTION DE LA LISTE DÉROULANTE VERS LE BAS (CUSTOM) ---
const searchInput = document.getElementById('employeSearchInput');
const dropdownList = document.getElementById('employeDropdownList');
const hiddenInput = document.getElementById('employeSelectionne');

function afficherDropdown(filtre = "") {
dropdownList.innerHTML = "";
const motsFiltre = filtre.toLowerCase();
const resultats = listeNomsEmployes.filter(nom => nom.toLowerCase().includes(motsFiltre));

if (resultats.length === 0) {
dropdownList.innerHTML = '<div class="p-3 text-sm text-gray-400 text-center">Aucun employé trouvé</div>';
} else {
resultats.forEach(nom => {
const item = document.createElement('div');
item.className = "p-3 text-sm text-gray-700 hover:bg-indigo-50 hover:text-indigo-600 cursor-pointer border-b border-gray-100 last:border-b-0";
item.textContent = nom;
item.addEventListener('click', () => {
searchInput.value = nom;
hiddenInput.value = nom;
dropdownList.classList.add('hidden');
});
dropdownList.appendChild(item);
});
}
dropdownList.classList.remove('hidden');
}

searchInput.addEventListener('focus', () => {
afficherDropdown(searchInput.value);
});

searchInput.addEventListener('input', (e) => {
hiddenInput.value = "";
afficherDropdown(e.target.value);
});

document.addEventListener('click', (e) => {
if (!searchInput.contains(e.target) && !dropdownList.contains(e.target)) {
dropdownList.classList.add('hidden');
}
});

onValue(pointagesRef, (snapshot) => {
const container = document.getElementById('adminListePointages');
container.innerHTML = '';
pointagesAujourdHuiGlobal = [];
const aujourdHuiStr = new Date().toLocaleDateString('fr-FR');
const maintenant = Date.now();
const limite24h = 24 * 60 * 60 * 1000;

if (snapshot.exists()) {
const data = snapshot.val();
Object.entries(data).reverse().forEach(([key, p]) => {
if (p.timestamp && (maintenant - p.timestamp <= limite24h)) {
if (p.date === aujourdHuiStr) {
pointagesAujourdHuiGlobal.push(p);
}

let gpsInfo = '';
if (p.latitude && p.longitude) {
const mapsUrl = `https://www.google.com/maps?q=${p.latitude},${p.longitude}`;
gpsInfo = ` 📍 <a href="${mapsUrl}" target="_blank" class="text-indigo-600 underline font-medium hover:text-indigo-800">Voir carte</a>`;
} else {
gpsInfo = ` <span class="text-gray-400">(Pas de GPS)</span>`;
}

let statutBadgeColor = "text-indigo-600 font-semibold";
if (p.statut === "ARRIVÉE (RETARD)") {
statutBadgeColor = "text-red-600 font-bold bg-red-50 px-1.5 py-0.5 rounded";
} else if (p.statut === "DÉPART") {
statutBadgeColor = "text-gray-700 font-semibold bg-gray-100 px-1.5 py-0.5 rounded";
}

const div = document.createElement('div');
div.className = "bg-white p-2 rounded border flex justify-between items-center";
div.innerHTML = `<span><b>${p.nom || 'Inconnu'}</b> - <span class="${statutBadgeColor}">${p.statut}</span><span class="text-xs ml-1">${gpsInfo}</span></span>
<span class="text-gray-500">${p.date} à ${p.heure}</span>`;
container.appendChild(div);
}
});
}
});

document.getElementById('btnArrivee').addEventListener('click', () => effectuerPointage('ARRIVÉE'));
document.getElementById('btnDepart').addEventListener('click', () => effectuerPointage('DÉPART'));

function effectuerPointage(statutDemande) {
let nom = hiddenInput.value.trim();
if (!nom) {
const saisieExacte = searchInput.value.trim();
if (listeNomsEmployes.includes(saisieExacte)) {
nom = saisieExacte;
}
}

if (!nom) {
afficherNotification("Veuillez sélectionner votre nom dans la liste.", "erreur");
return;
}

const aujourdHuiStr = new Date().toLocaleDateString('fr-FR');
let dejaArriveAujourdHui = false;
let dejaDepartAujourdHui = false;
let aSonArriveeCeJour = false;

pointagesAujourdHuiGlobal.forEach(p => {
if (p.nom === nom) {
if (p.statut === 'ARRIVÉE' || p.statut === 'ARRIVÉE (RETARD)') {
dejaArriveAujourdHui = true;
aSonArriveeCeJour = true;
}
if (p.statut === 'DÉPART') {
dejaDepartAujourdHui = true;
}
}
});

if (statutDemande === 'ARRIVÉE' && dejaArriveAujourdHui) {
afficherNotification("Vous avez déjà enregistré votre ARRIVÉE aujourd'hui.", "erreur");
return;
}

if (statutDemande === 'DÉPART' && dejaDepartAujourdHui) {
afficherNotification("Vous avez déjà enregistré votre DÉPART aujourd'hui.", "erreur");
return;
}

if (statutDemande === 'DÉPART' && !aSonArriveeCeJour) {
afficherNotification("Vous devez enregistrer votre ARRIVÉE avant de pointer votre DÉPART.", "erreur");
return;
}

let statutFinal = statutDemande;
if (statutDemande === 'ARRIVÉE') {
const nowCheck = new Date();
const totalMinutesActuelles = nowCheck.getHours() * 60 + nowCheck.getMinutes();
const limiteMinutes = 8 * 60 + 30; // 08:30
if (totalMinutesActuelles > limiteMinutes) {
statutFinal = 'ARRIVÉE (RETARD)';
}
}

if (navigator.geolocation) {
navigator.geolocation.getCurrentPosition(
(position) => {
sauvegarderPointageFirebase(statutFinal, nom, aujourdHuiStr, position.coords.latitude, position.coords.longitude);
},
(error) => {
sauvegarderPointageFirebase(statutFinal, nom, aujourdHuiStr, null, null);
},
{ enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
);
} else {
sauvegarderPointageFirebase(statutFinal, nom, aujourdHuiStr, null, null);
}
}

function sauvegarderPointageFirebase(statut, nom, aujourdHuiStr, lat, lon) {
const now = new Date();
const heureStr = now.toLocaleTimeString('fr-FR');

const payload = {
nom: nom,
statut: statut,
date: aujourdHuiStr,
heure: heureStr,
timestamp: Date.now()
};

if (lat !== null && lon !== null) {
payload.latitude = lat;
payload.longitude = lon;
}

push(pointagesRef, payload).then(() => {
document.getElementById('formulaireBox').classList.add('hidden');
const confirmBox = document.getElementById('ecranConfirmation');
const isRetard = statut.includes('RETARD');

document.getElementById('confirmTitre').textContent = isRetard ? `Pointage enregistré avec Retard !` : `Pointage (${statut}) validé !`;
document.getElementById('confirmDetails').innerHTML = `Merci <b>${nom}</b>.<br>Enregistrement effectué à <b>${heureStr}</b> le ${aujourdHuiStr}. ${isRetard ? '<br><span class="text-red-600 font-semibold">(Arrivée après 08h30 : Retard notifié)</span>' : ''}`;

confirmBox.classList.remove('hidden');

setTimeout(() => {
searchInput.value = '';
hiddenInput.value = '';
confirmBox.classList.add('hidden');
document.getElementById('formulaireBox').classList.remove('hidden');
}, 4000);
}).catch((error) => {
afficherNotification("Erreur de connexion : " + error.message, "erreur");
});
}

const btnToggleAdmin = document.getElementById('btnToggleAdmin');
const vueEmploye = document.getElementById('vueEmploye');
const vueAdmin = document.getElementById('vueAdmin');

btnToggleAdmin.addEventListener('click', () => {
if (vueAdmin.classList.contains('hidden')) {
vueAdmin.classList.remove('hidden');
vueEmploye.classList.add('hidden');
btnToggleAdmin.textContent = "⬅️ Espace Pointage";
} else {
vueAdmin.classList.add('hidden');
vueEmploye.classList.remove('hidden');
btnToggleAdmin.textContent = "🔒 Espace Admin";
}
});

document.getElementById('btnAdminLogin').addEventListener('click', () => {
const pwdSaisi = document.getElementById('adminPassword').value;
get(adminPassRef).then((snapshot) => {
const vraiMotDePasse = snapshot.exists() ? snapshot.val() : "admin123";
if (pwdSaisi === vraiMotDePasse) {
document.getElementById('adminLoginBox').classList.add('hidden');
document.getElementById('adminContent').classList.remove('hidden');
document.getElementById('adminPassword').value = '';
} else {
afficherNotification("Mot de passe administrateur incorrect.", "erreur");
}
});
});

document.getElementById('btnChangerPasswordAdmin').addEventListener('click', () => {
const nouveauMdp = document.getElementById('nouveauPasswordAdmin').value.trim();
if (!nouveauMdp) {
afficherNotification("Veuillez entrer un nouveau mot de passe admin.", "erreur");
return;
}
set(adminPassRef, nouveauMdp).then(() => {
document.getElementById('nouveauPasswordAdmin').value = '';
afficherNotification("Mot de passe administrateur mis à jour avec succès !", "succes");
});
});

document.getElementById('btnAjouterEmploye').addEventListener('click', () => {
const nom = document.getElementById('nouveauNom').value.trim();
if(nom) {
const newRef = push(employesRef);
set(newRef, { nom: nom }).then(() => {
document.getElementById('nouveauNom').value = '';
afficherNotification("Employé ajouté avec succès !", "succes");
});
} else {
afficherNotification("Veuillez entrer un nom valide.", "erreur");
}
});

window.supprimerEmploye = function(key) {
remove(ref(db, `employes/${key}`)).then(() => {
afficherNotification("Employé supprimé avec succès.", "succes");
});
};

window.genererPdfEmploye = function(nom) {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFillColor(79, 70, 229);
doc.rect(0, 0, 210, 25, 'F');
doc.setTextColor(255, 255, 255);
doc.setFont("helvetica", "bold");
doc.setFontSize(14);
doc.text("KHALIF INGÉNIERIE", 14, 16);

doc.setTextColor(30, 41, 59);
doc.setFontSize(16);
doc.text("FICHE COLLABORATEUR", 14, 40);

doc.autoTable({
startY: 50,
head: [['Information Salarié', 'Valeur']],
body: [
['Nom et Prénom', nom],
['Entreprise', 'Khalif Ingénierie'],
['Statut', 'Collaborateur']
],
theme: 'grid',
headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold' },
bodyStyles: { textColor: [51, 65, 85] }
});

doc.save(`Fiche_${nom.replace(/\s+/g, '_')}.pdf`);
};

document.getElementById('btnPdfJour').addEventListener('click', () => {
get(pointagesRef).then((snapshot) => {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();
const aujourdHui = new Date().toLocaleDateString('fr-FR');

doc.setFillColor(79, 70, 229);
doc.rect(0, 0, 210, 25, 'F');
doc.setTextColor(255, 255, 255);
doc.setFont("helvetica", "bold");
doc.setFontSize(14);
doc.text("KHALIF INGÉNIERIE", 14, 16);

doc.setTextColor(30, 41, 59);
doc.setFontSize(16);
doc.text("RAPPORT JOURNALIER DE POINTAGE", 14, 40);

doc.setFont("helvetica", "normal");
doc.setFontSize(11);
doc.setTextColor(100, 116, 139);
doc.text(`Date : ${aujourdHui}`, 14, 48);

let dataPresents = [];
let dataRetards = [];

if (snapshot.exists()) {
const data = snapshot.val();
Object.values(data).forEach(p => {
if(p.date === aujourdHui) {
if (p.statut === "ARRIVÉE (RETARD)") {
dataRetards.push([p.nom || 'Inconnu', p.heure, "Arrivée après 08h30"]);
} else {
dataPresents.push([p.nom || 'Inconnu', p.statut, p.heure]);
}
}
});
}

let currentY = 60;
doc.setFont("helvetica", "bold");
doc.setFontSize(12);
doc.setTextColor(30, 41, 59);
doc.text("PRÉSENCES ET MOUVEMENTS", 14, currentY);

if (dataPresents.length > 0) {
doc.autoTable({
startY: currentY + 5,
head: [['Nom et Prénom', 'Mouvement', 'Heure']],
body: dataPresents,
theme: 'grid',
headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255] }
});
currentY = doc.lastAutoTable.finalY + 15;
} else {
doc.setFont("helvetica", "italic");
doc.setFontSize(10);
doc.text("Aucun pointage enregistré.", 14, currentY + 10);
currentY += 25;
}

doc.setFont("helvetica", "bold");
doc.setFontSize(12);
doc.setTextColor(185, 28, 28);
doc.text("RETARDS DU JOUR (Limite : 08H30)", 14, currentY);

if (dataRetards.length > 0) {
doc.autoTable({
startY: currentY + 5,
head: [['Nom et Prénom', "Heure d'arrivée", 'Motif']],
body: dataRetards,
theme: 'grid',
headStyles: { fillColor: [220, 38, 38], textColor: [255, 255, 255] }
});
} else {
doc.autoTable({
startY: currentY + 5,
head: [['Nom et Prénom', "Heure d'arrivée", 'Motif']],
body: [['Aucun retard', '-', '-']],
theme: 'grid',
headStyles: { fillColor: [100, 116, 139], textColor: [255, 255, 255] }
});
}

doc.save(`Pointage_${aujourdHui.replace(/\//g, '-')}.pdf`);
});
});

// --- EXPORT GLOBAL EXCEL PRO AVEC CALCUL D'HEURES DE PRÉSENCE ET D'ABSENCE ---
document.getElementById('btnExcelGlobal').addEventListener('click', () => {
    Promise.all([get(employesRef), get(pointagesRef)]).then(([empSnap, pointSnap]) => {
        let tousEmployes = [];
        if (empSnap.exists()) {
            tousEmployes = Object.values(empSnap.val()).map(e => e.nom);
        } else {
            tousEmployes = listeInitialeEmployes;
        }

        let pointagesParEmployeDate = {};
        if (pointSnap.exists()) {
            const data = pointSnap.val();
            Object.values(data).forEach(p => {
                const nom = p.nom || 'Inconnu';
                const date = p.date || 'Inconnue';
                if (!pointagesParEmployeDate[nom]) pointagesParEmployeDate[nom] = {};
                if (!pointagesParEmployeDate[nom][date]) pointagesParEmployeDate[nom][date] = { arrivee: null, depart: null };

                if (p.statut === 'ARRIVÉE' || p.statut === 'ARRIVÉE (RETARD)') {
                    pointagesParEmployeDate[nom][date].arrivee = p.heure;
                } else if (p.statut === 'DÉPART') {
                    pointagesParEmployeDate[nom][date].depart = p.heure;
                }
            });
        }

        let lignesExcel = [];
        const journeeStandardHeures = 8; // Base de 8h de travail par jour standard

        tousEmployes.forEach(nom => {
            const datesEmploye = pointagesParEmployeDate[nom] || {};
            let totalHeuresTravaillees = 0;
            let joursTravaillesCount = 0;

            Object.values(datesEmploye).forEach(mvt => {
                if (mvt.arrivee && mvt.depart) {
                    const [hArr, mArr] = mvt.arrivee.split(':').map(Number);
                    const [hDep, mDep] = mvt.depart.split(':').map(Number);
                    const minutesTravaillees = (hDep * 60 + mDep) - (hArr * 60 + mArr);
                    if (minutesTravaillees > 0) {
                        totalHeuresTravaillees += minutesTravaillees / 60;
                        joursTravaillesCount++;
                    }
                }
            });

            const heuresAttendues = joursTravaillesCount * journeeStandardHeures;
            let heuresAbsence = heuresAttendues - totalHeuresTravaillees;
            if (heuresAbsence < 0) heuresAbsence = 0;

            lignesExcel.push({
                "Nom et Prénom": nom,
                "Jours Présents": joursTravaillesCount,
                "Total Heures Présence": Number(totalHeuresTravaillees.toFixed(2)),
                "Heures d'Absence Estimées": Number(heuresAbsence.toFixed(2)),
                "Statut Global": joursTravaillesCount > 0 ? "Actif" : "Aucun pointage récent"
            });
        });

        const worksheet = XLSX.utils.json_to_sheet(lignesExcel);
        const colWidths = [{ wch: 25 }, { wch: 18 }, { wch: 22 }, { wch: 25 }, { wch: 20 }];
        worksheet['!cols'] = colWidths;

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Bilan Heures & Absences");

        const nomFichier = `Recapitulatif_Heures_Absences_${new Date().toLocaleDateString('fr-FR').replace(/\//g, '-')}.xlsx`;
        XLSX.writeFile(workbook, nomFichier);

        afficherNotification("Fichier Excel récapitulatif généré avec succès !", "succes");
    });
});
</script>
