<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointage — Khalif Ingénierie</title>
    <!-- Tailwind CSS pour un design propre -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col justify-between">

    <!-- En-tête / Heure -->
    <div class="max-w-xl mx-auto px-4 py-8 w-full">
        <div class="text-center mb-8">
            <span class="text-xs font-semibold tracking-wider text-indigo-600 uppercase">Khalif Ingénierie • Registre de présence</span>
            <div id="clock" class="text-4xl font-extrabold text-gray-900 mt-2">--:--:--</div>
            <div id="date" class="text-sm text-gray-500 mt-1">-</div>
        </div>

        <!-- Formulaire de pointage -->
        <div class="bg-white shadow rounded-2xl p-6 border border-gray-100">
            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Nom de l'employé</label>
            
            <select id="employeSelect" class="w-full border border-gray-300 rounded-lg p-3 text-gray-800 bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-4">
                <option value="">— sélectionner —</option>
            </select>

            <label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-2">Code PIN (optionnel)</label>
            <input type="password" id="pinInput" placeholder="...." class="w-full border border-gray-300 rounded-lg p-3 text-gray-800 bg-gray-50 focus:ring-2 focus:ring-indigo-500 focus:outline-none mb-6 tracking-widest text-center text-lg">

            <div class="grid grid-cols-2 gap-4">
                <button id="btnArrivee" class="bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-indigo-700 transition">ARRIVÉE</button>
                <button id="btnDepart" class="bg-gray-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-gray-700 transition">DÉPART</button>
            </div>
        </div>

        <!-- Dernier statut affiché -->
        <div class="bg-white shadow rounded-2xl p-6 border border-gray-100 mt-6">
            <div class="grid grid-cols-2 gap-4 text-sm">
                <div>
                    <span class="block text-xs text-gray-400 uppercase">Nom</span>
                    <span id="statutNom" class="font-medium text-gray-800">—</span>
                </div>
                <div>
                    <span class="block text-xs text-gray-400 uppercase">Statut</span>
                    <span id="statutType" class="font-medium text-gray-800">—</span>
                </div>
                <div class="mt-4">
                    <span class="block text-xs text-gray-400 uppercase">Date</span>
                    <span id="statutDate" class="font-medium text-gray-800">—</span>
                </div>
                <div class="mt-4">
                    <span class="block text-xs text-gray-400 uppercase">Heure</span>
                    <span id="statutHeure" class="font-medium text-gray-800">—</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Firebase et Logique -->
    <script type="module">
        // Importation de Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuration Firebase (tes clés)
        const firebaseConfig = {
            apiKey: "AIzaSyDQzystm4eWC2_8fdWoLHFThThhM3cwq0",
            authDomain: "pointage-khalif.firebaseapp.com",
            databaseURL: "https://pointage-khalif-default-rtdb.firebaseio.com",
            projectId: "pointage-khalif",
            storageBucket: "pointage-khalif.appspot.com",
            messagingSenderId: "568693399015",
            appId: "1:568693399015:web:d9097c0d29dd5ae6e5b142",
            measurementId: "G-XM50BF3EP0"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Liste complète des employés
        const listeEmployes = [
            "Khalif",
            "Anani Ulrich",
            "Jean",
            "ASSALE Anabelle",
            "BOKA Axel",
            "GBE Keani Elue Excelle",
            "GOUAN Fiacre",
            "KOUAKOU Carole",
            "OULAI Tiemoko Perside",
            "OUEDRAOGO Nicanor",
            "OYEKALE Samuel Sunday",
            "SEDE Mleanin Cecile",
            "TEHA Kouyo Franck",
            "YOLOU Bleda Sandrine",
            "WAYOU Claude Sostherne",
            "ADOPO Jorim",
            "TAPE Marie-Emmanuelle",
            "CAMARA Alpha",
            "KOFFI Israel",
            "OPKO Michel"
        ];

        // Remplissage automatique du menu déroulant au chargement
        document.addEventListener("DOMContentLoaded", () => {
            const selectElement = document.getElementById("employeSelect");
            
            if (selectElement) {
                listeEmployes.sort(); // Tri alphabétique
                listeEmployes.forEach(nom => {
                    const option = document.createElement("option");
                    option.value = nom;
                    option.textContent = nom;
                    selectElement.appendChild(option);
                });
            }

            // Mise à jour de l'heure en direct
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
                document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }, 1000);
        });

        // Gestion des clics sur Arrivée / Départ
        document.getElementById('btnArrivee').addEventListener('click', () => enregistrerPointage('ARRIVÉE'));
        document.getElementById('btnDepart').addEventListener('click', () => enregistrerPointage('DÉPART'));

        function enregistrerPointage(type) {
            const nom = document.getElementById('employeSelect').value;
            if (!nom) {
                alert("Veuillez sélectionner un employé dans la liste !");
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('fr-FR');
            const heureStr = now.toLocaleTimeString('fr-FR');

            // Envoi vers Firebase Realtime Database
            const pointagesRef = ref(db, 'pointages');
            push(pointagesRef, {
                employe: nom,
                statut: type,
                date: dateStr,
                heure: heureStr,
                timestamp: Date.now()
            }).then(() => {
                // Affichage dans l'encadré de confirmation
                document.getElementById('statutNom').textContent = nom;
                document.getElementById('statutType').textContent = type;
                document.getElementById('statutDate').textContent = dateStr;
                document.getElementById('statutHeure').textContent = heureStr;
                alert(`Pointage (${type}) enregistré avec succès pour ${nom} !`);
            }).catch((error) => {
                alert("Erreur lors de l'enregistrement : " + error.message);
            });
        }
    </script>
</body>
</html>
